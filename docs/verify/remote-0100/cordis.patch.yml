# dsh-firefight-mod-tools — profile bundle patch.
#
# The harness replaces this plugin entry as one line and does not deep-merge it,
# so every key you omit falls back to the default in the plugin's own Config
# schema (lib/config.js). Keep only the keys you want to override.
#
# scriptPath/editorRoot must point at a firefight-mod-editor checkout (the
# directory holding `ff.py`); firefightRoot is the stock game install.
- insert:
    - id: dsh-firefight-mod-tools
      name: 'dsh-firefight-mod-tools'
      config:
        pythonPath: python
        editorRoot: ''
        scriptPath: ''
        firefightRoot: ''
        workspace: ''
        timeoutMs: 60000
        maxOutputChars: 40000
        enableExport: false
